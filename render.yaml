# Render Blueprint — deploy no plano gratuito
# 1) Crie um repositório no GitHub com este projeto e faça push.
# 2) No render.com: New > Blueprint > conecte o repositório > Apply.
# Resultado: https://agrolote.onrender.com com HTTPS + PWA instalável.
#
# O banco é PostgreSQL (grátis) — PERSISTENTE entre deploys/restart.
# O disco do plano free do Render é efêmero, por isso não usamos mais SQLite local.

databases:
  - name: agrolote-db
    databaseName: agrolote
    user: agrolote
    plan: free
    region: virginia
    postgresMajorVersion: 16

services:
  - type: web
    name: agrolote
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm run install:all && npm run build --prefix client
    startCommand: npm run start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render roda `npm install` com NODE_ENV=production, o que PULA as
      # devDependencies (vite, typescript, @types). Sem isso o build do
      # client falha. Isso garante que as devDeps sejam instaladas no build.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: SEED_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrolote-db
          property: connectionString
