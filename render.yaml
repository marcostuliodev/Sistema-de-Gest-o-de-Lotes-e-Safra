# Render Blueprint — deploy no plano gratuito
# 1) Crie um repositório no GitHub com este projeto e faça push.
# 2) No render.com: New > Blueprint > conecte o repositório > Apply.
# Resultado: HTTPS + PWA instalável.
#
# O serviço web e o cron job exigem o mesmo CRON_KEY. Defina-o manualmente
# nos dois services após aplicar o Blueprint.
#
# MongoDB é a única fonte de dados do servidor. Informe a URI do cluster
# (Atlas ou MongoDB persistente) no secret MONGODB_URI do serviço.
# Use replica set/sharded cluster; exclusões exigem transações.

services:
  - type: web
    name: agrolote
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm run install:all && npm run build --prefix client
    startCommand: npm run start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render roda `npm install` com NODE_ENV=production, o que PULA as
      # devDependencies (vite, typescript, @types). Sem isso o build do
      # client falha. Isso garante que as devDeps sejam instaladas no build.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: agrolote
      - key: MAX_PROJECTS_PER_OWNER
        value: "20"
  - type: cron
    name: agrolote-weather-cron
    schedule: "*/15 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl --fail --silent --show-error --max-time 55
      -H "x-cron-key: $CRON_KEY"
      https://agrolote.marcostuliogc.com.br/api/cron/weather
    envVars:
      - key: CRON_KEY
        sync: false
